name: Collect and publish WineRadar

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1,13 * * *'

permissions:
  contents: read

concurrency:
  group: wineradar-catalog-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      state: ${{ steps.state.outputs.state }}
    steps:
      - name: Checkout public catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: true
      - name: Set up Node
        id: node
        continue-on-error: true
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned dependency
        id: dependencies
        continue-on-error: true
        timeout-minutes: 2
        run: npm ci --ignore-scripts --no-audit --no-fund --fetch-retries=0 --fetch-timeout=30000
      - name: Check source and public data
        id: source
        run: node scripts/check.mjs
      - name: Run data and failure-handling tests
        id: tests
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        run: npm test
      - name: Install browser
        id: browser
        if: steps.tests.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        run: npx --no-install playwright install --with-deps chromium
      - name: Collect bounded public wine sample
        id: collect
        if: steps.browser.outcome == 'success' && steps.tests.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        run: npm run collect
      - name: Record failed collection or setup without replacing the last good catalog
        if: always() && !cancelled() && steps.collect.outcome != 'success'
        env:
          FAILURE_STAGE: ${{ steps.dependencies.outcome != 'success' && 'dependencies' || steps.tests.outcome != 'success' && 'tests' || steps.browser.outcome != 'success' && 'browser' || 'collection' }}
        run: node scripts/record-failure.mjs
      - name: Build complete static HTML and JSON
        if: always() && !cancelled()
        run: node scripts/build.mjs
      - name: Audit publication files
        run: node scripts/check.mjs
      - name: Persist only public data and update status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/catalog.json data/status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update public wine catalog and collection status'
            git push origin HEAD:main
          fi
      - name: Report collection state
        id: state
        run: node scripts/report-state.mjs
      - name: Upload only the static site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Deploy audited site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

  verify:
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify anonymous public HTTP responses and data freshness
        run: node scripts/verify-public.mjs
